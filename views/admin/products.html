<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm — Quản trị SmartCart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css//admin/admin.css" />
    <link rel="stylesheet" href="/css/admin/products.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main-content">
        <header class="topbar">
          <button class="sidebar-toggle" id="sidebarToggle">≡</button>
          <h1 class="page-title">Sản phẩm</h1>
          <div class="topbar-right">
            <span class="topbar-time" id="currentTime"></span>
            <button class="btn-primary" id="btnOpenAdd">+ Thêm sản phẩm</button>
          </div>
        </header>

        <div class="page-body">
          <div class="section-card">
            <div class="section-header">
              <h2 class="section-title">Danh sách sản phẩm</h2>
              <div class="section-tools">
                <input
                  type="text"
                  id="searchInput"
                  placeholder="Tìm kiếm sản phẩm..."
                  class="input-search"
                />
                <select id="filterCategory" class="input-select">
                  <option value="">Tất cả danh mục</option>
                </select>
              </div>
            </div>

            <div class="table-wrap">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Ảnh</th>
                    <th>Tên sản phẩm</th>
                    <th>Danh mục</th>
                    <th>Giá</th>
                    <th>Tồn kho</th>
                    <th>Ngày tạo</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="productsTable">
                  <tr>
                    <td colspan="7" class="table-loading">Đang tải...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- MODAL THÊM / SỬA -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title" id="modalTitle">Thêm sản phẩm</h2>
          <button class="modal-close" id="btnCloseModal">✕</button>
        </div>

        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label>Tên sản phẩm <span class="required">*</span></label>
              <input
                type="text"
                id="inputName"
                placeholder="Nhập tên sản phẩm"
              />
            </div>
            <div class="form-group">
              <label>Danh mục <span class="required">*</span></label>
              <select id="inputCategory">
                <option value="">Chọn danh mục</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Giá <span class="required">*</span></label>
              <input type="number" id="inputPrice" placeholder="Nhập giá" />
            </div>
            <div class="form-group">
              <label>Tồn kho <span class="required">*</span></label>
              <input
                type="number"
                id="inputStock"
                placeholder="Nhập số lượng"
              />
            </div>
          </div>

          <div class="form-group">
            <label>Mô tả</label>
            <textarea
              id="inputDescription"
              rows="3"
              placeholder="Nhập mô tả sản phẩm"
            ></textarea>
          </div>

          <div class="form-group">
            <label>Ảnh sản phẩm</label>
            <input type="file" id="inputImage" accept="image/*" />
            <div class="image-preview" id="imagePreview">
              <span>Chưa có ảnh</span>
            </div>
          </div>

          <div id="formError" class="form-error"></div>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" id="btnCancelModal">Huỷ</button>
          <button class="btn-primary" id="btnSubmitModal">Lưu sản phẩm</button>
        </div>
      </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/components/sidebar.js"></script>
    <script src="/js/admin/admin-utils.js"></script>
    <script src="/js/admin/products.js"></script>
    <script>
      renderSidebar("products");
    </script>
  </body>
</html>
