<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Banner — SmartCart</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/admin/admin.css" />
    <link rel="stylesheet" href="/css/admin/banner.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main-content">
        <header class="topbar">
          <button class="sidebar-toggle" id="sidebarToggle">≡</button>
          <h1 class="page-title">Quản lý Banner</h1>
          <div class="topbar-right">
            <span class="topbar-time" id="currentTime"></span>
            <button class="btn-primary" id="btnOpenAdd">+ Thêm Banner</button>
          </div>
        </header>

        <div class="page-body">
          <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr)">
            <div class="stat-card stat-green">
              <div class="stat-value" id="stat-total">—</div>
              <div class="stat-label">Tổng banner</div>
              <div class="stat-icon">◈</div>
            </div>
            <div class="stat-card stat-blue">
              <div class="stat-value" id="stat-active">—</div>
              <div class="stat-label">Đang hiển thị</div>
              <div class="stat-icon">◉</div>
            </div>
            <div class="stat-card stat-red">
              <div class="stat-value" id="stat-inactive">—</div>
              <div class="stat-label">Đã ẩn</div>
              <div class="stat-icon">✕</div>
            </div>
          </div>

          <div class="section-card">
            <div class="section-header">
              <h2 class="section-title">Danh sách Banner</h2>
              <div class="section-tools">
                <select id="filterStatus" class="input-select">
                  <option value="">Tất cả</option>
                  <option value="active">Đang hiển thị</option>
                  <option value="inactive">Đã ẩn</option>
                </select>
              </div>
            </div>

            <div class="table-wrap">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Ảnh</th>
                    <th>Tiêu đề</th>
                    <th>Link</th>
                    <th>Vị trí</th>
                    <th>Trạng thái</th>
                    <th>Ngày tạo</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="bannersTable">
                  <tr>
                    <td colspan="7" class="table-loading">Đang tải...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- MODAL THÊM BANNER -->
    <div class="modal-overlay" id="modalAdd">
      <div class="modal" style="max-width: 500px">
        <div class="modal-header">
          <h2 class="modal-title">Thêm Banner mới</h2>
          <button class="modal-close" id="btnCloseAdd">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label
              >Tiêu đề
              <span style="color: var(--text-muted); font-size: 11px"
                >(tuỳ chọn)</span
              ></label
            >
            <input
              type="text"
              id="inputTitle"
              placeholder="Nhập tiêu đề banner"
            />
          </div>
          <div class="form-group">
            <label
              >Link khi click
              <span style="color: var(--text-muted); font-size: 11px"
                >(tuỳ chọn)</span
              ></label
            >
            <input type="text" id="inputLink" placeholder="https://..." />
          </div>
          <div class="form-group">
            <label>Vị trí hiển thị</label>
            <select id="inputPosition">
              <option value="HERO">Banner chính (Hero)</option>
              <option value="SUB">Banner phụ</option>
              <option value="POPUP">Popup</option>
            </select>
          </div>
          <div class="form-group">
            <label>Ảnh Banner <span class="required">*</span></label>
            <input type="file" id="inputImage" accept="image/*" />
            <div class="image-preview" id="imagePreview">
              <span>Chưa có ảnh</span>
            </div>
          </div>
          <div id="addError" class="form-error"></div>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" id="btnCancelAdd">Huỷ</button>
          <button class="btn-primary" id="btnSubmitAdd">Thêm Banner</button>
        </div>
      </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/components/sidebar.js"></script>
    <script src="/js/admin/admin-utils.js"></script>
    <script src="/js/admin/banner.js"></script>
    <script>
      renderSidebar("banners");
    </script>
  </body>
</html>
